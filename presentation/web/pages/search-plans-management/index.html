<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Search Plans Management</title>
    <link rel="stylesheet" href="/web/shared/theme.css" />
    <link rel="stylesheet" href="/web/pages/search-plans-management/styles.css" />
  </head>
  <body>
    <main class="page">
      <header class="page-header">
        <h1>Search Plans Management</h1>
        <a class="button" href="/ui/video-downloads">Open Video Queue</a>
      </header>

      <section class="card">
        <h2>Create Plan</h2>
        <form id="plan-form" class="plan-form">
          <input id="plan-query" placeholder="Search query" required />
          <select id="plan-source">
            <option value="manual">manual</option>
            <option value="groq">groq</option>
          </select>
          <input id="plan-keywords" placeholder="keywords (comma separated)" />
          <input id="plan-negative" placeholder="negative keywords (comma separated)" />
          <button class="button" type="submit">Start manually</button>
          <button class="button" id="auto-start-btn" type="button">Start automatically (AI)</button>
        </form>
        <p class="helper-text">
          Automatic mode sends a hard seed keyword string to AI, gets a generated keyword list, creates the plan, and runs search immediately.
        </p>
      </section>

      <section class="card">
        <h2>Plans</h2>
        <ul id="plans-list" class="plans-list"></ul>
      </section>

      <section class="card">
        <h2>Selected Plan Results</h2>
        <ul id="results-list" class="plans-list"></ul>
      </section>
    </main>
    <script src="/web/pages/search-plans-management/script.js"></script>
  </body>
</html>
