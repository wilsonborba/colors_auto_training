<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Search Plans Management</title>
    <link rel="stylesheet" href="../../shared/theme.css" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="page">
      <header class="page-header">
        <h1>Search Plans Management</h1>
      </header>

      <section class="card">
        <h2>Create Plan</h2>
        <form id="plan-form" class="plan-form">
          <input id="plan-name" placeholder="Plan name" required />
          <input id="plan-query" placeholder="Search query" required />
          <button class="button" type="submit">Create plan</button>
        </form>
      </section>

      <section class="card">
        <h2>Plans</h2>
        <ul id="plans-list" class="plans-list"></ul>
      </section>
    </main>
    <script src="./script.js"></script>
  </body>
</html>
