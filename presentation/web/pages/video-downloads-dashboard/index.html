<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Video Downloads Dashboard</title>
    <link rel="stylesheet" href="../../shared/theme.css" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="page">
      <header class="page-header">
        <h1>Video Downloads Dashboard</h1>
        <button class="button">Queue New Download</button>
      </header>

      <section class="table-card">
        <table class="downloads-table">
          <thead>
            <tr>
              <th>Video</th>
              <th>Priority</th>
              <th>Status</th>
              <th>Progress</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="downloads-tbody"></tbody>
        </table>
      </section>
    </main>
    <script src="./script.js"></script>
  </body>
</html>
