<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Video Downloads Dashboard</title>
    <link rel="stylesheet" href="/web/shared/theme.css" />
    <link rel="stylesheet" href="/web/pages/video-downloads-dashboard/styles.css" />
  </head>
  <body>
    <main class="page">
      <header class="page-header">
        <h1>Video Downloads Dashboard</h1>
        <a class="button" href="/ui/search-plans">Open Search Plans</a>
      </header>

      <section class="table-card">
        <table class="downloads-table">
          <thead>
            <tr>
              <th>Video</th>
              <th>Priority</th>
              <th>Status</th>
              <th>Source URL</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="downloads-tbody"></tbody>
        </table>
      </section>
    </main>
    <script src="/web/pages/video-downloads-dashboard/script.js"></script>
  </body>
</html>
